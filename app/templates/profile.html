{% extends "base.html" %}{% block content %}<div class="card"><h1>My Profile</h1><p class="muted">{{ s.name }} · {{ s.email }}</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="grid">
<div><label>Department</label><input name="department" value="{{ s.department }}" required></div><div><label>Year</label><input name="year" type="number" min="1" max="6" value="{{ s.year }}" required></div>
<div><label>CGPA</label><input name="cgpa" type="number" step="0.01" min="0" max="10" value="{{ s.cgpa }}" required></div>
<div><label>Active backlogs</label><input name="active_backlogs" type="number" min="0" value="{{ s.active_backlogs }}"></div></div>
<label>Skills (comma separated)</label><input name="skills" value="{{ s.skills }}"><p class="muted">Skill catalogue: {{ skills|map(attribute='skill_name')|join(', ') or '-' }}</p>
<p><button class="btn">Save</button></p></form></div>{% endblock %}
