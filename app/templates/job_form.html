{% extends "base.html" %}{% block content %}<div class="card"><h1>Post a Job</h1>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="grid">
<div><label>Job title</label><input name="job_title" required></div><div><label>Salary</label><input name="salary" type="number" min="0" step="1000"></div>
<div><label>Minimum CGPA</label><input name="min_cgpa" type="number" step="0.01" min="0" max="10" value="0"></div>
<div><label>Max active backlogs (blank = no limit)</label><input name="max_backlogs" type="number" min="0"></div>
<div><label>Allowed departments (comma separated, blank = all)</label><input name="allowed_departments" placeholder="CSE, IT"></div>
<div><label>Deadline</label><input name="deadline" type="date"></div></div>
<label>Description</label><textarea name="description" rows="3"></textarea>
<label>Required skills</label><input name="required_skills" placeholder="{{ skills|map(attribute='skill_name')|join(', ') }}">
<label>Additional eligibility notes</label><input name="eligibility_criteria"><p><button class="btn">Publish</button></p></form></div>{% endblock %}
