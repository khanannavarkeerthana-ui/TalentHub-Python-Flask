{% extends "base.html" %}{% block content %}<div class="card"><h1>Student Sign-up</h1>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="grid">
<div><label>Name</label><input name="name" required></div><div><label>Email</label><input name="email" type="email" required></div>
<div><label>Password (min 8)</label><input name="password" type="password" required></div><div><label>Department</label><input name="department" placeholder="e.g. CSE" required></div>
<div><label>Year</label><input name="year" type="number" min="1" max="6" required></div><div><label>CGPA</label><input name="cgpa" type="number" step="0.01" min="0" max="10" required></div>
<div><label>Active backlogs</label><input name="active_backlogs" type="number" min="0" value="0"></div>
<div><label>Skills (comma separated)</label><input name="skills" placeholder="{{ skills|map(attribute='skill_name')|join(', ') }}"></div></div>
<p><button class="btn">Create account</button></p></form></div>{% endblock %}
